<!doctype html>
<main data-mcel-id="application" data-mcel-purpose="workspace">
  <section data-mcel-id="mode" data-mcel-purpose="mode-control" data-mcel-priority="supporting"><h2>Mode</h2></section>
  <section data-mcel-id="arithmetic" data-mcel-when-state="state:mode" data-mcel-when-value="basic" data-mcel-purpose="input" data-mcel-tasks="compute" data-mcel-priority="primary" data-mcel-prefer-density="compact" data-mcel-prefer-width-group="calculation" data-mcel-prefer-sizing="intrinsic"></section>
  <output data-mcel-id="answer" data-mcel-when-state="state:mode" data-mcel-when-value="basic" data-mcel-purpose="results" data-mcel-priority="primary" data-mcel-prefer-density="compact" data-mcel-prefer-width-group="calculation" data-mcel-prefer-sizing="intrinsic" data-mcel-prefer-align="end"><h2>Calculated Result</h2></output>
  <section data-mcel-id="graph-input" data-mcel-when-state="state:mode" data-mcel-when-value="graphing" data-mcel-purpose="input" data-mcel-tasks="compute" data-mcel-priority="secondary"><h2>Graph a Function</h2></section>
  <output data-mcel-id="graph-output" data-mcel-when-state="state:mode" data-mcel-when-value="graphing" data-mcel-purpose="results" data-mcel-prefer-representation="graphical"><h2>Function Graph</h2></output>
  <section data-mcel-id="mathics-input" data-mcel-when-state="state:mode" data-mcel-when-value="symbolic" data-mcel-purpose="input" data-mcel-tasks="compute"><h2>Symbolic Mathematics (Mathics)</h2></section>
  <output data-mcel-id="mathics-output" data-mcel-when-state="state:mode" data-mcel-when-value="symbolic" data-mcel-purpose="results"><h2>Symbolic Result</h2></output>
  <section data-mcel-id="helpers" data-mcel-when-state="state:mode" data-mcel-when-value="help" data-mcel-purpose="assistance" data-mcel-tasks="review"><h2>Model Assistance</h2></section>
  <output data-mcel-id="helper-output" data-mcel-when-state="state:mode" data-mcel-when-value="help" data-mcel-purpose="results"><h2>Suggested Expression</h2></output>
  <section data-mcel-id="qa" data-mcel-when-state="state:mode" data-mcel-when-value="help" data-mcel-purpose="assistance" data-mcel-tasks="review"><h2>Ask About Your Result</h2></section>
  <output data-mcel-id="qa-output" data-mcel-when-state="state:mode" data-mcel-when-value="help" data-mcel-purpose="results"><h2>Explanation</h2></output>
  <section data-mcel-id="status" data-mcel-purpose="status"><h2>Operation History</h2></section>
</main>
