name: main-computer-nanojev

services:
  nanojev:
    build:
      context: .
      dockerfile: docker/nanojev/Dockerfile
    image: main-computer/nanojev:managed-v2
    container_name: main-computer-nanojev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIN_COMPUTER_NANOJEV_BIND_PORT:-9765}:9765"
    environment:
      MAIN_COMPUTER_NANOJEV_CHECKPOINT: "${MAIN_COMPUTER_NANOJEV_CHECKPOINT:-champion}"
      MAIN_COMPUTER_NANOJEV_HF_REPO: "${MAIN_COMPUTER_NANOJEV_HF_REPO:-johnrraymond/NanoJev-CLEF}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    volumes:
      - nanojev-hf-cache:/root/.cache/huggingface
    gpus: all
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:9765/api/health',timeout=2)); raise SystemExit(0 if d.get('ready') is True and d.get('model_loaded_once') is True else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 900s

volumes:
  nanojev-hf-cache:
