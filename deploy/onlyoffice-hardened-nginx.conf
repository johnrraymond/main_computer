# Candidate-only browser-facing Document Server origin, no MC session forwarded.
# Use the certificate whose SAN includes onlyoffice.main-computer.localhost.
# Audit only the presence of the session cookie, never its value or URLs.
map $http_cookie $mc_docs_has_session_cookie {
    default 0;
    ~__Host-MC-Session= 1;
}
log_format mc_docs_cookie_audit '$mc_docs_has_session_cookie';
map $http_upgrade $oo_connection_upgrade {
    default upgrade;
    '' close;
}
# Never route an unknown browser hostname into Document Server.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    return 421;
}
server {
    listen 443 ssl;
    server_name onlyoffice.main-computer.localhost;
    access_log /var/log/nginx/mc-docs-cookie-audit.log mc_docs_cookie_audit;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /mc-editor-host.html {
        alias /etc/nginx/mc-editor/host.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline' 'self'; frame-src 'self'; connect-src 'self' wss:; img-src 'self' data:; frame-ancestors https://dev.main-computer.localhost:* https://unleashed.main-computer.localhost:* https://debug.main-computer.localhost:* https://safe.main-computer.localhost:*; object-src 'none'; base-uri 'none'" always;
    }
    location = /mc-editor-host.js {
        alias /etc/nginx/mc-editor/host.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://onlyoffice:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oo_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        # These browser requests must NEVER convey an MC authentication cookie.
        proxy_set_header Cookie "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
