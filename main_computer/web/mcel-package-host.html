<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCEL Application Package Host</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    #mcel-package-host { width: min(48rem, calc(100vw - 2rem)); }
    [data-mcel-host-status="error"] { white-space: pre-wrap; color: #b00020; }
  </style>
</head>
<body>
  <main id="mcel-package-host" aria-live="polite">
    <p data-mcel-host-status="loading">Loading MCEL application package…</p>
    <div data-mcel-package-content></div>
  </main>

  <script src="applications/scripts/mcel-contract.js"></script>
  <script src="applications/scripts/mcel-scm.js"></script>
  <script src="applications/scripts/mcel-application-runtime.js"></script>
  <script src="applications/scripts/mcel-core.js"></script>
  <script src="applications/scripts/mcel-application-package-catalog.js"></script>
  <script src="applications/scripts/mcel-epistemic-status.js"></script>
  <script src="applications/scripts/mcel-observation-bundle.js"></script>
  <script src="applications/scripts/mcel-browser-observation-producer.js"></script>
  <script src="applications/scripts/mcel-application-operation-observer.js"></script>
  <script src="applications/scripts/mcel-application-browser-scenario-runner.js"></script>
  <script type="module" src="applications/scripts/mcel-application-package-host.js"></script>
</body>
</html>
