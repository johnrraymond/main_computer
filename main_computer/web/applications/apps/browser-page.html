<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCEL Browser</title>
  <style>/* BROWSER_STYLES */</style>
</head>
<body>
  <main class="browser-app" id="browser-app" data-mcel-app="browser">
    <form class="browser-toolbar" id="browser-toolbar" autocomplete="off" aria-label="Browser navigation">
      <button id="browser-back" type="button" title="Back" aria-label="Back">←</button>
      <button id="browser-forward" type="button" title="Forward" aria-label="Forward">→</button>
      <button id="browser-reload" type="button" title="Reload" aria-label="Reload">↻</button>
      <label class="browser-address-label" for="browser-address">Address</label>
      <input id="browser-address" type="text" spellcheck="false" aria-label="Remote website address" placeholder="https://example.org" />
      <button id="browser-go" type="submit">Go</button>
    </form>
    <div class="browser-status" role="status" aria-live="polite">
      <span id="browser-page-title">Scramjet</span>
      <span id="browser-status">Starting isolated browser…</span>
    </div>
    <div class="browser-surface" id="browser-surface" role="region" aria-label="Isolated browser viewport">
      <iframe id="browser-frame" title="Untrusted website in isolated Scramjet origin" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
      <div class="browser-empty" id="browser-empty">Docker browser initializing…</div>
    </div>
    <div class="browser-hint">Remote websites execute in a separate Docker-backed origin. MCEL localhost and private networks are blocked. Ctrl+L edits the address.</div>
  </main>
  <script>/* BROWSER_SCRIPT */</script>
</body>
</html>
