# MCEL Layout Frob Lab machine-readable acceptance obligations.
# Candidate engines MUST NOT evaluate or certify their own outputs.
# Statuses describe verified evidence, not aspirational design.
schema: main-computer.mcel.layout-frob-crosscheck.v1
id: task-manager-layout-frob
design_source: mcel_apps/task-manager/design.yaml
purpose: Evaluate MCEL semantics-to-presentation and layout machines/engines independently of Task Manager-specific CSS
  or handwritten coordinates.
authority:
  domain_truth: design.yaml describes intent, not runtime certification
  engine_truth: only actual tested production MCEL modules count as implementations
  measurement_truth: independent browser and effect evidence; never use planner self-score as acceptance
  safety: read-only/offline fixtures by default; no live PID, server, wallet, AI, or worker mutations
  live_app: unchanged until separate parity, authorization, and rollback proof
  no_website_builder_changes: true
verdicts:
  PASS: Independent applicable assertion passed with linked evidence.
  FAIL: Observed violation of an asserted requirement.
  UNVERIFIED: Runner exists but required environment, measurement, human decision, or evidence is unavailable.
  NOT_IMPLEMENTED: Required runner, machine, engine, presentation binding, or producer does not exist.
  BLOCKED: A prerequisite failed; include dependency and original refusal evidence.
  NOT_APPLICABLE: A capability is explicitly incompatible; requires a documented compatibility reason.
coverage_rules:
  full:
  - semantics.primitives
  - semantics.entities
  - semantics.relationships
  - rows.types
  - data_sources
  - intents.read_only
  - intents.consequential
  - workflows
  - hierarchy.children
  - hierarchy
  all_designed_objects_must_be_accounted_for: true
  no_implicit_skip: true
  new_design_members_require_new_test_instances: true
  negative_controls_required: true
  human_review_separate_from_automated_scoring: true
  default_result_on_missing_runner: NOT_IMPLEMENTED
  default_result_on_missing_required_evidence: UNVERIFIED
  claim_rule: PASS only for evidence-backed instance; no collection-level PASS unless every member passed
fixture_catalog:
  empty: Zero process/port/work-item rows; explicit empty telemetry and empty tasks.
  normal: Multiple process owners, ports, Python associations, active worker task and AI request.
  crowded: Hundreds of processes and network connections; multiple concurrent operations.
  long_text: Long command lines, Unicode labels, long paths, IPv6, wrapping and truncation.
  partial: Missing CPU/GPU, withheld command, orphan relationships, unknown process ownership.
  stale: Old snapshot, PID reused, activity heartbeat gap, late completion after timeout.
  failure: Rejected action, backend timeout, browser network loss, AI provider error.
  adversarial: Duplicate IDs, unsafe command, invalid port, contradictory hints, surprise untrusted strings.
sweep_policy:
  widths_css_px:
  - 320
  - 390
  - 768
  - 1024
  - 1440
  - 1920
  font_scales:
  - 1.0
  - 1.25
  - 1.5
  - 2.0
  fixtures:
  - empty
  - normal
  - crowded
  - long_text
  - partial
  - stale
  - failure
  - adversarial
  access_modes:
  - pointer
  - keyboard
  - touch
  - reduced_motion
  hint_strengths:
  - none
  - suggest
  - prefer
  - constrain
  - require
  search_strategy: bounded_pairwise_plus_declared_critical_cross_product
  critical_cross_product:
    widths_css_px:
    - 320
    - 390
    - 1440
    fixtures:
    - normal
    - crowded
    - long_text
    - stale
    - failure
    hint_strengths:
    - none
    - suggest
    - prefer
    - constrain
    - require
  seed: 2401024
  timeout_policy: Record timeout and whether search truncated; never claim global optimum from bounded search.
  candidate_policy: Persist all tested candidates, rejections, valid rankings and deterministically replayable winners.
layout_machines:
- id: workspace_inference
  implementation: main_computer/web/applications/scripts/mcel-semantic-layout-inference.js:inferWorkspaceLayout
  availability: existing
  boundary: workspace region ordering/packing
- id: canonical_tree
  implementation: main_computer/web/applications/scripts/mcel-semantic-layout-inference.js:evaluateCanonicalLayoutTree
  availability: existing
  boundary: recursive group/control-grid region candidates
- id: adaptive_control_grid
  implementation: main_computer/web/applications/scripts/mcel-semantic-layout-inference.js
  availability: existing_limited
  boundary: local control groups, not a full application shell
- id: constraint_layout
  implementation: null
  availability: proposed
  boundary: layout constraints and alternative arrangements
planning_engines:
- id: workspace_greedy
  availability: existing
  method: heuristic order and packing
- id: bounded_recursive
  availability: existing
  method: bounded candidate enumeration with valid-candidate ranking
- id: graded_hint
  availability: proposed
  method: graded-authority constraints and objective-guided ranking
- id: constraint_optimization
  availability: proposed
  method: solver-based feasible alternatives and explanation
compatibility:
- machine: adaptive_control_grid
  engine: bounded_recursive
  state: subtree_only
- machine: adaptive_control_grid
  engine: constraint_optimization
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: adaptive_control_grid
  engine: graded_hint
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: adaptive_control_grid
  engine: workspace_greedy
  state: unassessed
  note: No certified adapter for this pairing.
- machine: canonical_tree
  engine: bounded_recursive
  state: available
- machine: canonical_tree
  engine: constraint_optimization
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: canonical_tree
  engine: graded_hint
  state: needs_adapter
- machine: canonical_tree
  engine: workspace_greedy
  state: unassessed
  note: No certified adapter for this pairing.
- machine: constraint_layout
  engine: bounded_recursive
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: constraint_layout
  engine: constraint_optimization
  state: not_implemented
- machine: constraint_layout
  engine: graded_hint
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: constraint_layout
  engine: workspace_greedy
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: workspace_inference
  engine: bounded_recursive
  state: unassessed
  note: No certified adapter for this pairing.
- machine: workspace_inference
  engine: constraint_optimization
  state: not_implemented
  note: No certified adapter for this pairing.
- machine: workspace_inference
  engine: graded_hint
  state: needs_adapter
- machine: workspace_inference
  engine: workspace_greedy
  state: available
negative_controls:
- id: unsat_hard_hints
  linked_tests:
  - H04-constrain-hard
  - H05-require-hard
  - H07-conflict-minimal
  mutation: Make require top-left and require bottom-right for the same region on the same viewport
  must: REFUSE with both hint IDs; never pick arbitrary success
- id: unknown_semantic_entity
  linked_tests:
  - S04-row-reference
  - C08-pattern-refusal
  mutation: Reference a nonexistent row entity
  must: FAIL static, refuse generating pattern
- id: duplicate_entity_identity
  linked_tests:
  - C03-identity-stability
  - I04-relationship-navigation
  mutation: Same PID with changed process start time
  must: Not treated as same target
- id: browser_text_collision
  linked_tests:
  - B03-no-overflow
  - B05-readable-data
  mutation: Inject long path/IPv6 plus large font at 320px
  must: Geometry must reject overlap/clipping
- id: server_timeout
  linked_tests:
  - R05-operation-lifecycle
  - R07-no-duplicate-action
  mutation: Timeout after action dispatch without receipt
  must: UNKNOWN with reconciliation, no implicit retry
- id: unauthorized_termination
  linked_tests:
  - R08-terminate-guard
  - R09-confirmation
  mutation: Try terminate mismatched reused PID
  must: No backend effect
- id: absent_worker_provider
  linked_tests:
  - R03-worker-task-feed
  - R04-ai-call-feed
  mutation: Remove producer telemetry
  must: UNVERIFIED/UNAVAILABLE rather than success
- id: fake_schedule_dispatch
  linked_tests:
  - R10-schedule-not-claim
  mutation: Store schedule with no dispatcher
  must: Show stored, not running/completed
- id: silent_machine_fallback
  linked_tests:
  - M09-unsupported-pair-refusal
  mutation: Select unsupported planner-machine combination
  must: NOT_IMPLEMENTED/refusal with original pair retained
- id: fabricated_browser_certificate
  linked_tests:
  - Q08-console-report-agreement
  - Q07-run-provenance
  mutation: Make console column count differ from evidence JSON
  must: FAIL provenance consistency
hint_language:
  authorities:
    none: No authored influence; baseline defaults only.
    suggest: Soft, disposable suggestion; violation recorded and explained.
    prefer: Strongly weighted soft preference; violation has explicit reason.
    constrain: Feasibility condition; refusal if impossible.
    require: Hard acceptance obligation; refuse if violated in any applicable viewport.
  properties:
  - priority
  - position
  - reading_order
  - prominence
  - proximity
  - grouping
  - density
  - containment
  - min_size
  - available_space
  - presentation
  - visibility
  - responsive_substitution
  scopes:
  - all
  - desktop
  - tablet
  - mobile
  - state_conditional
  precedence:
  - semantic_and_safety_invariants
  - require
  - constrain
  - prefer
  - suggest
  - machine_defaults
  must_report:
  - source_hint_id
  - viewport
  - applicability
  - satisfied
  - relaxed
  - conflicted
  - reason
  - selected_candidate_id
  prohibitions:
  - silently_downgrade_hard_hints
  - assume_priority_from_visual_position
  - allow_visual_hint_to_authorize_effect
  - invent_constraint_feasibility
run_provenance:
  required_fields:
  - run_id
  - utc_timestamp
  - source_commit_or_archive_sha256
  - design_sha256
  - contract_sha256
  - machine_version
  - engine_version
  - browser_name
  - browser_version
  - platform
  - viewport
  - fixture_sha256
  - hint_sha256
  - sweep_seed
  artifact_sha256_required: true
  console_report_agreement_required: true
  no_reuse_across_source_versions: true
candidate_contract:
  required_fields:
  - candidate_id
  - machine
  - engine
  - semantic_fingerprint
  - fixture_fingerprint
  - hint_fingerprint
  - viewport
  - pattern_map
  - tree
  - measurements
  - constraints
  - trace
  - search_truncated
  immutability: true
  replay_independent_of_planner: true
  report_rejections_as_well_as_successes: true
