acceptance_policy:
  static_contract_ready: Every static design/reference/coverage obligation PASS; contract validates.
  layout_experiment_ready: All layout hard requirements pass at mandated viewports; graded hints have complete decision
    trace; unknown and unimplemented explicitly named.
  application_ready: All applicable semantic, row, interaction, operation, accessibility and runtime cases pass; human
    review and rollback proof present.
  no_single_number_quality_gate: Retain dimensional metrics plus recorded human preference; never pass aesthetics based
    on no-overflow only.
  frob_result: Overall PASS only if every required applicable instance passes; missing feature is NOT_IMPLEMENTED, absent
    evidence UNVERIFIED.
  separate_scope_reports:
  - static
  - layout
  - runtime
  - authoring
  - promotion
  pre_registration: Freeze fixtures, thresholds, seeds and benchmark cases before evaluating a candidate engine.
tests:
- id: S01-primitive-shape
  group: semantic
  probe: static.contract_fields
  target: semantics.primitives
  assertion:
    required_fields:
    - status
    - fields
  description: Every semantic primitive declares its status and fields.
  required: true
  foreach: mapping_keys
- id: S02-entity-shape
  group: semantic
  probe: static.contract_fields
  target: semantics.entities
  assertion:
    required_fields:
    - status
    - identity
  description: Every domain entity declares status and identity.
  required: true
  foreach: mapping_keys
- id: S03-row-shape
  group: semantic
  probe: static.contract_fields
  target: rows.types
  assertion:
    required_fields:
    - entity
    - primary
    - status
  description: Every projected row declares entity, primary fields and truthful status.
  required: true
  foreach: mapping_keys
- id: S04-row-reference
  group: semantic
  probe: static.refs_resolve
  target: rows.types
  assertion:
    field: entity
    namespace:
    - semantics.entities
    - semantics.primitives
  description: Rows must refer to declared semantic entities.
  required: true
  foreach: mapping_keys
- id: S05-workflow-shape
  group: semantic
  probe: static.contract_fields
  target: workflows
  assertion:
    required_fields:
    - id
    - path
    - status
  description: Every user journey is identified and has a path.
  required: true
  foreach: sequence_members
- id: S06-datasource-shape
  group: semantic
  probe: static.contract_fields
  target: data_sources
  assertion:
    required_fields:
    - status
  description: Every source advertises its implementation status.
  required: true
  foreach: mapping_keys
- id: S07-region-shape
  group: semantic
  probe: static.contract_fields
  target: hierarchy.children
  assertion:
    required_fields:
    - id
    - role
  description: All top-level regions are identifiable.
  required: true
  foreach: sequence_members
- id: S09-readonly-intents
  group: semantic
  probe: static.contract_fields
  target: intents.read_only
  assertion:
    required_fields:
    - id
    - status
  description: Every read-only intent is accounted for.
  required: true
  foreach: sequence_members
- id: S10-consequential-intents
  group: semantic
  probe: static.contract_fields
  target: intents.consequential
  assertion:
    required_fields:
    - id
    - status
  description: Every consequential intent is accounted for.
  required: true
  foreach: sequence_members
- id: S11-relationship-refs
  group: semantic
  probe: static.refs_resolve
  target: semantics.relationships
  assertion:
    field: relation_endpoints
    namespace:
    - semantics.entities
    - semantics.primitives
  description: Relationship endpoints reference defined objects.
  required: true
  foreach: sequence_members
- id: S12-hierarchy-nodes
  group: semantic
  probe: static.hierarchy_integrity
  target: hierarchy
  assertion:
    required_fields:
    - id
  description: Every nested region, view, section and semantic stub is visible to Frob planning.
  required: true
  foreach: hierarchy_nodes
- id: S08-full-coverage
  group: semantic
  probe: static.design_coverage
  target: coverage_rules.full
  assertion:
    required: true
  description: Expand all declared semantics, rows, workflows, intents, data sources and regions; new members cannot
    disappear.
  required: true
- id: C01-compiler-no-loss
  group: semantic
  probe: semantic.compiler
  target: hierarchy
  assertion:
    predicate: semantics_survive_ir
    expected: true
  description: Compiled IR preserves all essential entities, references, visibility and design intent.
  required: true
  axes:
  - machine
- id: C02-relations-evidence
  group: semantic
  probe: semantic.relationships
  target: semantics.relationships
  assertion:
    predicate: relationships_resolvable
    expected: true
  description: Object relationships have stable identities and unresolved links are honest.
  required: true
  foreach: sequence_members
- id: C03-identity-stability
  group: semantic
  probe: semantic.relationships
  target: semantics.entities.process
  assertion:
    predicate: pid_reuse_not_same_process
    expected: true
  description: PID reuse must not connect to the wrong process or authorize a stale action.
  required: true
  fixtures:
  - stale
- id: C04-work-item-identity
  group: semantic
  probe: semantic.relationships
  target: semantics.entities.worker_task
  assertion:
    predicate: remote_identity_without_pid
    expected: true
  description: Remote worker tasks have attempt identity even without a local PID.
  required: true
  fixtures:
  - normal
  - partial
- id: C05-observation-truth
  group: semantic
  probe: runtime.observations
  target: semantics.primitives.observation
  assertion:
    predicate: missing_is_not_zero
    expected: true
  description: Unobserved, unavailable, stale and zero remain distinct.
  required: true
  fixtures:
  - empty
  - partial
  - stale
- id: C06-domain-rows
  group: presentation
  probe: catalog.presentation
  target: rows.types
  assertion:
    predicate: presentation_for_each_row
    modes:
    - table_row
    - compact_row
    - detail_panel
    - narrow_card
  description: Reusable catalog must select presentation variants for every row type.
  required: true
  foreach: mapping_keys
  axes:
  - viewport
- id: C07-no-handcrafted-layout
  group: presentation
  probe: catalog.presentation
  target: hierarchy.children
  assertion:
    predicate: no_app_specific_geometry
    expected: true
  description: All standard areas are generated from shared contracts, not custom layout CSS.
  required: true
  foreach: sequence_members
- id: C10-hierarchy-rendered
  group: presentation
  probe: browser.geometry
  target: hierarchy
  assertion:
    predicate: all_declared_semantic_nodes_have_rendered_or_declared_intentionally_nonvisual_representation
    expected: true
  description: Every nested semantic region or component must be mapped, not merely the six top-level regions.
  required: true
  foreach: hierarchy_nodes
  axes:
  - viewport
- id: C08-pattern-refusal
  group: presentation
  probe: catalog.presentation
  target: rows.types
  assertion:
    predicate: unsupported_pattern_refuses
    expected: true
  description: Unsupported semantic interaction or relationship presentation must disclose gap.
  required: true
  fixtures:
  - adversarial
- id: M01-compatibility-report
  group: planner
  probe: planner.capabilities
  target: compatibility
  assertion:
    predicate: all_pairings_explicit
    expected: true
  description: Enumerate feasible/incompatible/unbuilt machine×engine pairs with explanations.
  required: true
- id: M02-same-input
  group: planner
  probe: planner.candidates
  target: sweep_policy
  assertion:
    predicate: frozen_inputs_all_candidates
    expected: true
  description: All candidate comparisons consume identical semantic, fixture, hint and viewport fingerprints.
  required: true
  axes:
  - machine
  - engine
- id: M03-candidate-manifest
  group: planner
  probe: planner.candidates
  target: candidate_contract
  assertion:
    predicate: complete_candidate_trace
    expected: true
  description: Persist all candidates, rankings, rejections, and search truncation.
  required: true
  axes:
  - machine
  - engine
- id: M04-inert-probe
  group: planner
  probe: planner.candidates
  target: candidate_contract
  assertion:
    predicate: no_live_dom_or_side_effect_mutation
    expected: true
  description: Measuring rejected variants changes neither live DOM nor real services.
  required: true
  fixtures:
  - adversarial
- id: M05-deterministic-replay
  group: planner
  probe: planner.candidates
  target: candidate_contract
  assertion:
    predicate: replay_reproduces_geometry
    tolerance_px: 1
  description: Frozen candidate must replay without rerunning or changing the planner.
  required: true
  axes:
  - viewport
- id: M06-bounded-search
  group: planner
  probe: planner.candidates
  target: sweep_policy
  assertion:
    predicate: bounded_search_reports_truncation
    expected: true
  description: Planner may stop at its budget but must report incomplete search without global-optimum claim.
  required: true
  fixtures:
  - crowded
- id: M07-ranking-multicriteria
  group: planner
  probe: planner.objectives
  target: acceptance_policy
  assertion:
    predicate: rank_feasible_without_collapsing_metrics
    metrics:
    - priority
    - legibility
    - density
    - balance
    - stability
    - effort
    - runtime
  description: Compare independent quality dimensions and Pareto tradeoffs.
  required: true
  axes:
  - machine
  - engine
- id: M09-unsupported-pair-refusal
  group: planner
  probe: planner.capabilities
  target: compatibility
  assertion:
    predicate: incompatible_pairs_report_not_applicable_or_unimplemented
    expected: true
  description: An unimplemented machine or engine pair must not silently fall back or masquerade as another.
  required: true
- id: M08-cross-application
  group: generalization
  probe: planner.candidates
  target: application
  assertion:
    predicate: holdout_apps_with_same_public_contracts
    minimum_distinct_apps: 2
  description: Task Manager plus independent holdout must work without app-name heuristics.
  required: true
- id: H01-none-baseline
  group: hints
  probe: planner.hints
  target: hint_language
  assertion:
    predicate: baseline_not_special_cased
    expected: true
  description: With no hints run machine defaults; record which priorities it missed.
  required: true
  axes:
  - viewport
- id: H02-suggest-soft
  group: hints
  probe: planner.hints
  target: hint_language
  assertion:
    predicate: suggest_can_relax_with_reason
    expected: true
  description: Soft suggestion may lose to a better feasible layout; reason recorded.
  required: true
  axes:
  - viewport
- id: H03-prefer-ranking
  group: hints
  probe: planner.hints
  target: hint_language
  assertion:
    predicate: prefer_shifts_ranking_or_explains
    expected: true
  description: Increasing to prefer must affect score/decision or explain lack of change.
  required: true
  axes:
  - viewport
- id: H04-constrain-hard
  group: hints
  probe: planner.hints
  target: hint_language
  assertion:
    predicate: constrain_cannot_silently_relax
    expected: true
  description: Unsatisfied structural constraint rejects the candidate.
  required: true
  fixtures:
  - adversarial
  critical: true
- id: H05-require-hard
